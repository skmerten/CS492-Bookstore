<!DOCTYPE html>
<html>
<head>
    <title>Bookstore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <h1>Welcome to the Bookstore</h1>

    <a href="/inventory/" class="btn btn-primary">Browse Books</a>
    <a href="/cart/" class="btn btn-outline-primary">View Cart</a>

    {% if user.is_authenticated %}

        <p>Logged in as {{ user.username }}</p>
        <a href="/sales/cash-payment/" class="btn btn-success">
            Cashier Sales
        </a>

        <form method="post" action="/logout/">
            {% csrf_token %}
            <button type="submit" class="btn btn-primary">Logout</button>
        </form>

    {% else %}

        <a href="/login/" class="btn btn-secondary">Employee Login</a>

    {% endif %}

</body>
</html>
