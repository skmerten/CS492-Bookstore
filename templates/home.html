{% extends "base.html" %}

{% block title %}
    Home | Bookstore
{% endblock %}

{% block content %}

<div class="text-center py-5">

    <h1>Welcome to the Bookstore</h1>

    <p class="lead">
        Browse our available books or view your shopping cart.
    </p>

    <div class="mt-4">

        <a
            href="{% url 'books' %}"
            class="btn btn-primary btn-lg"
        >
            Browse Books
        </a>

        <a
            href="{% url 'cart:detail' %}"
            class="btn btn-outline-primary btn-lg"
        >
            View Cart
        </a>

    </div>

</div>

{% endblock %}
