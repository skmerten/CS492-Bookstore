{% extends "base.html" %}

{% block title %}
    Employee Login | Bookstore
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6 col-lg-4">

        <div class="card">
            <div class="card-body">

                <h1 class="h3 mb-4">
                    Employee Login
                </h1>

                {% if form.errors %}
                    <div class="alert alert-danger">
                        Invalid username or password.
                    </div>
                {% endif %}

                <form method="post">

                    {% csrf_token %}

                    {{ form.as_p }}

                    <button
                        type="submit"
                        class="btn btn-primary w-100"
                    >
                        Login
                    </button>

                </form>

            </div>
        </div>

    </div>

</div>

{% endblock %}
