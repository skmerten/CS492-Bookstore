{% extends "base.html" %}

{% block title %}
    Book Information | Bookstore
{% endblock %}

{% block content %}

<h1>Book Information</h1>

<form method="post">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit" class="btn btn-success">
        Save
    </button>

    <a href="{% url 'books' %}" class="btn btn-secondary">
        Cancel
    </a>

</form>

{% endblock %}
