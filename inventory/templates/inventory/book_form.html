<!DOCTYPE html>
<html>
<head>
    <title>Book</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <h1>Book Information</h1>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-success">
            Save

    </form>

    <p>
        <a href="{% url 'books' %}" class="btn btn-secondary">
            Cancel
        </a>
    </p>

</body>
</html>
